<path d="M490,188 L365,310" fill="none" stroke="#15202B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M765,159 L805,159" fill="none" stroke="#15202B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M690,188 L690,310" fill="none" stroke="#15202B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="698" y="262" font-size="12" font-style="italic" text-anchor="start" fill="#60717E">banking question, nothing relevant</text>
