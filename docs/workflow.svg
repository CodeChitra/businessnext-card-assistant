<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1780 718" width="1780" height="718" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" role="img" aria-label="The agent workflow, drawn from the compiled graph">
