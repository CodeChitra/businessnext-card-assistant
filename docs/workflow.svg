<text x="1262" y="262" font-size="12" font-style="italic" text-anchor="start" fill="#60717E">re-check</text>
<path d="M1290,188 L1365,310" fill="none" stroke="#15202B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="1344" y="230" font-size="12" font-style="italic" text-anchor="start" fill="#60717E">fails again</text>
<path d="M1440,339 L1470,339 L1470,188" fill="none" stroke="#15202B" stroke-width="1.6" marker-end="url(#a)"/>
