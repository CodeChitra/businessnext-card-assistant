<path d="M1145,159 L1185,159" fill="none" stroke="#15202B" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M1335,159 L1375,159" fill="none" stroke="#15202B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="1355" y="147" font-size="12" font-style="italic" text-anchor="middle" fill="#60717E">pass</text>
