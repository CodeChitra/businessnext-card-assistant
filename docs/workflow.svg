<path d="M1640,130 L1640,90" fill="none" stroke="#15202B" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="45" y="130" width="150" height="58" rx="8" fill="#E3F1EF" stroke="#0B6E69" stroke-width="1.8"/><text x="120" y="155" font-size="15" font-weight="600" text-anchor="middle" fill="#15202B">input_guard</text><text x="120" y="174" font-size="12" text-anchor="middle" fill="#60717E">door guard</text>
<rect x="235" y="130" width="150" height="58" rx="8" fill="#FBF1DC" stroke="#9A6200" stroke-width="1.8"/><text x="310" y="155" font-size="15" font-weight="600" text-anchor="middle" fill="#15202B">classify</text><text x="310" y="174" font-size="12" text-anchor="middle" fill="#60717E">scope + intent</text>
<rect x="425" y="130" width="150" height="58" rx="8" fill="#E9EFF5" stroke="#17324D" stroke-width="1.8"/><text x="500" y="155" font-size="15" font-weight="600" text-anchor="middle" fill="#15202B">load_account</text><text x="500" y="174" font-size="12" text-anchor="middle" fill="#60717E">fetch the account</text>
<rect x="615" y="130" width="150" height="58" rx="8" fill="#E3F1EF" stroke="#0B6E69" stroke-width="1.8"/><text x="690" y="155" font-size="15" font-weight="600" text-anchor="middle" fill="#15202B">retrieve</text><text x="690" y="174" font-size="12" text-anchor="middle" fill="#60717E">find policy pages</text>
<rect x="805" y="130" width="150" height="58" rx="8" fill="#E3F1EF" stroke="#0B6E69" stroke-width="1.8"/><text x="880" y="155" font-size="15" font-weight="600" text-anchor="middle" fill="#15202B">policy</text><text x="880" y="174" font-size="12" text-anchor="middle" fill="#60717E">rules engine</text>
<rect x="995" y="130" width="150" height="58" rx="8" fill="#FBF1DC" stroke="#9A6200" stroke-width="1.8"/><text x="1070" y="155" font-size="15" font-weight="600" text-anchor="middle" fill="#15202B">generate</text><text x="1070" y="174" font-size="12" text-anchor="middle" fill="#60717E">write the reply</text>
<rect x="1185" y="130" width="150" height="58" rx="8" fill="#E3F1EF" stroke="#0B6E69" stroke-width="1.8"/><text x="1260" y="155" font-size="15" font-weight="600" text-anchor="middle" fill="#15202B">validate</text><text x="1260" y="174" font-size="12" text-anchor="middle" fill="#60717E">citations + guards</text>
<rect x="1375" y="130" width="150" height="58" rx="8" fill="#E9EFF5" stroke="#17324D" stroke-width="1.8"/><text x="1450" y="155" font-size="15" font-weight="600" text-anchor="middle" fill="#15202B">act</text><text x="1450" y="174" font-size="12" text-anchor="middle" fill="#60717E">raise the request</text>
<rect x="1565" y="130" width="150" height="58" rx="8" fill="#E3F1EF" stroke="#0B6E69" stroke-width="1.8"/><text x="1640" y="155" font-size="15" font-weight="600" text-anchor="middle" fill="#15202B">finalize</text><text x="1640" y="174" font-size="12" text-anchor="middle" fill="#60717E">package + receipt</text>
<rect x="235" y="310" width="150" height="58" rx="8" fill="#FFFFFF" stroke="#60717E" stroke-width="1.8" stroke-dasharray="6 4"/><text x="310" y="335" font-size="15" font-weight="600" text-anchor="middle" fill="#15202B">short_circuit</text><text x="310" y="354" font-size="12" text-anchor="middle" fill="#60717E">fixed reply, no AI</text>
<rect x="615" y="310" width="150" height="58" rx="8" fill="#FFFFFF" stroke="#60717E" stroke-width="1.8" stroke-dasharray="6 4"/><text x="690" y="335" font-size="15" font-weight="600" text-anchor="middle" fill="#15202B">uncovered</text><text x="690" y="354" font-size="12" text-anchor="middle" fill="#60717E">refuse + route</text>
<rect x="1110" y="310" width="150" height="58" rx="8" fill="#FBF1DC" stroke="#9A6200" stroke-width="1.8"/><text x="1185" y="335" font-size="15" font-weight="600" text-anchor="middle" fill="#15202B">repair</text><text x="1185" y="354" font-size="12" text-anchor="middle" fill="#60717E">fix it, once</text>
<rect x="1290" y="310" width="150" height="58" rx="8" fill="#FFFFFF" stroke="#60717E" stroke-width="1.8" stroke-dasharray="6 4"/><text x="1365" y="335" font-size="15" font-weight="600" text-anchor="middle" fill="#15202B">safe_fallback</text><text x="1365" y="354" font-size="12" text-anchor="middle" fill="#60717E">safe message</text>
<text x="45" y="590" font-size="13" font-weight="600" fill="#15202B">Key</text>
<rect x="45" y="604" width="28" height="18" rx="4" fill="#FBF1DC" stroke="#9A6200" stroke-width="1.6"/><text x="83" y="618" font-size="13" fill="#15202B">a model call</text>
<rect x="275" y="604" width="28" height="18" rx="4" fill="#E3F1EF" stroke="#0B6E69" stroke-width="1.6"/><text x="313" y="618" font-size="13" fill="#15202B">plain code, no model</text>
<rect x="505" y="604" width="28" height="18" rx="4" fill="#E9EFF5" stroke="#17324D" stroke-width="1.6"/><text x="543" y="618" font-size="13" fill="#15202B">a supplied tool</text>
<rect x="735" y="604" width="28" height="18" rx="4" fill="#FFFFFF" stroke="#60717E" stroke-width="1.6" stroke-dasharray="6 4"/><text x="773" y="618" font-size="13" fill="#15202B">early exit or fallback</text>
<path d="M980,613 L1030,613" stroke="#15202B" stroke-width="1.6" marker-end="url(#a)"/><text x="1040" y="618" font-size="13" fill="#15202B">always</text><path d="M1110,613 L1160,613" stroke="#15202B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="1170" y="618" font-size="13" fill="#15202B">decided by a check</text>
<text x="45" y="652" font-size="13" fill="#60717E">Early exits skip everything after them: a pure greeting or another customer's data (door guard), a greeting or off-topic question (scope + intent), an unknown customer (fetch the account).</text><text x="45" y="672" font-size="13" fill="#60717E">The model writes the reply but never decides: the rules engine decides, and plain code checks the model's work before anything reaches the customer.</text>
<text x="45" y="702" font-size="12" fill="#60717E">Drawn from the compiled LangGraph by scripts/workflow_diagram.py; a test fails if this picture and the real graph ever disagree.</text>
</svg>
