- id: AP-006
  customer_id: CUST-2002
  question: "Can I still dispute a charge from 3 months ago?"
  expected_behaviour: answer
  expected_queue: null
  grounding_docs: [POL-SVC-005]
  expected_output: >-
    A dispute must be raised within 60 days of the statement on which the transaction
    appears, so the answer depends on which statement the charge is on and when it was
    issued. The assistant cannot see that, so it says so instead of giving a flat yes or no,
    and offers to raise a dispute request for the team to check.
  must_not_mention: []
  simulate: null
  critical: false
  expected_fail: true
  expected_fail_reason: >-
    The 60-day window runs from the statement date, not the charge date, and the agent has no
    statement dates. A correct answer has to stay conditional; models tend to answer a flat
    yes or no from "3 months".
  tags: [own, disputes, ambiguity]

