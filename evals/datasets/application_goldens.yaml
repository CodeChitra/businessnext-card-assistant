  grounding_docs: [POL-SVC-006, POL-FEE-007]
  expected_output: >-
    States the credit limit of 1,20,000, raises a card block request with the urgent cards
    team (update within 4 hours), and states the foreign currency markup of 3.5%.
  must_not_mention: []
  simulate: null
  critical: false
  expected_fail: true
  expected_fail_reason: >-
    Three intents in one message. The classifier returns a single intent, so retrieval and
    the rules target one of them, and the answer is likely to drop at least one part.
  tags: [own, multi-intent]

