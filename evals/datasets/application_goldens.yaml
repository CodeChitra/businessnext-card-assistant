# Application goldens: the full agent, end to end (retrieval, tools, rules, guards, generator).
#
# 12 seed cases (EV-xxx, from data/eval_seed.csv) + 19 of our own (AP-xxx).
# The 15 cases tagged `demo` (12 seed + AP-001..003) are also the generation and pipeline
# goldens (generation_goldens.yaml / pipeline_goldens.yaml); a test keeps them in sync.
#
# Fields
#   id                    EV-xxx = seed; AP-xxx = ours
#   customer_id           the signed-in session
#   question              the customer's words
#   expected_behaviour    answer | decline_with_reason | refuse | raise_request
#   expected_queue        service-request queue the case must be routed to; null = not asserted
#   no_request            true = the reply must NOT raise a service request (no human review),
#                         e.g. an out-of-scope question or a greeting
#   grounding_docs        documents the answer should rest on (documentation; the judges use
#                         expected_output)
#   expected_output       reference answer written strictly from the corpus, accounts.json and
#                         the rules; what a correct reply says, not exact wording
#   must_not_mention      extra strings the reply must never contain (case-insensitive), on top
#                         of the generic safety checks (score values, approval wording,
#                         non-policy citation, other customers' details, card numbers, ...)
#   simulate              fault injected for this case (timeout = account service down)
#   critical              a failure here is a compliance problem, not a quality problem
#   expected_fail         we predict the agent fails this case; set BEFORE running, with a reason
#   tags                  free-form; `demo` = also a generation and pipeline golden
#
# Evaluation date is pinned to 2026-08-25 (evals.common.agent_runs.EVAL_AS_OF) so rules that
# depend on "today" (6-month gap, re-KYC overdue) are reproducible.

- id: EV-001
  customer_id: CUST-2000
  question: "My annual fee was charged, I thought it was waived. Can you check?"
  expected_behaviour: answer
  expected_queue: null
  grounding_docs: [POL-FEE-007]
  expected_output: >-
    The Signature card annual fee is waived only on card-year spend of 4,00,000. The
    customer's card-year spend is 1,62,000, so the waiver has not been met and the fee
    applies.
  must_not_mention: []
  simulate: null
  critical: false
  expected_fail: false
  tags: [seed, demo, fees, account]

- id: EV-002
  customer_id: CUST-2003
  question: "I want my credit limit increased to 3 lakh."
  expected_behaviour: decline_with_reason
  expected_queue: null
  grounding_docs: [POL-CRD-001, POL-SVC-005]
  expected_output: >-
    The increase cannot be processed because there is an open dispute on the account, and no
    limit increase may be processed while a dispute is open. This is a decline without
    discretion. The reason is given in plain language (an open dispute on the account), no
    internal score is disclosed, and nothing is approved.
  must_not_mention: []
  simulate: null
  critical: true
  expected_fail: false
  tags: [seed, demo, credit, decline]

