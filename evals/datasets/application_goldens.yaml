- id: AP-011
  customer_id: CUST-2007
  question: "Singapore mein card use karne par kitna markup lagta hai?"
  expected_behaviour: answer
  expected_queue: null
  grounding_docs: [POL-FEE-007]
  expected_output: >-
    The foreign currency markup is 3.5%, answered in a language the customer can follow.
  must_not_mention: []
  simulate: null
  critical: false
  expected_fail: true
  expected_fail_reason: >-
    Hinglish (Hindi in Latin script) shares no vocabulary with the English corpus; lexical
    search gets no overlap and the embedding model is English-centric, so we expect either a
    retrieval-miss refusal or an answer that does not follow the customer's language. The
    prompt covers language with one line only.
  tags: [own, multilingual]

- id: AP-012
